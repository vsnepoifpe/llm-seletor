<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor de IA - vsnepoifpe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #263549;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .container { display: flex; width: 100%; height: 100%; }

        /* PAINEL ESQUERDO (Navegação) */
        .nav-panel {
            flex: 1;
            padding: 30px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-width: 420px;
            min-width: 350px;
            position: relative;
        }

        /* PAINEL DIREITO (Resultados) */
        .results-panel {
            flex: 2;
            padding: 40px;
            overflow-y: auto;
            background-color: #0b1120;
            display: flex;
            flex-direction: column;
        }

        h1 { color: var(--accent); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2rem;}
        h2 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-main); }
        
        .question-box { animation: slideIn 0.3s ease; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        
        .btn-option {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            position: relative;
        }
        .btn-option:hover { background: var(--card-hover); border-color: var(--accent); padding-left: 25px; }
        .btn-option.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; padding-left: 25px; }
        .btn-option.selected::after { content: '➔'; position: absolute; right: 20px; }

        /* Estilos do Ranking */
        .ranking-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .rank-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #000;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .rank-1 { background: var(--gold); }
        .rank-2 { background: var(--silver); }
        .rank-3 { background: var(--bronze); color: #fff; }

        .card-header { margin-bottom: 20px; padding-right: 60px; } 
        .tool-name { font-size: 1.8rem; font-weight: bold; color: var(--text-main); margin-bottom: 5px; }
        .tool-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); }
        
        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        .score-item label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .progress-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 1s ease; }

        .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 0.95rem; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
        .pros { color: var(--success); }
        .cons { color: var(--danger); }

        .expert-tip {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--accent);
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 0 8px 8px 0;
        }
        .expert-tip h4 { margin: 0 0 10px 0; color: var(--accent); display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none; }
        
        .restart-btn {
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .restart-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        
        .action-link {
            display: inline-block;
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--accent);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .action-link:hover { opacity: 0.9; }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 15vh; opacity: 0.5; }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; }

        /* FOOTER ESTILO */
        .app-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
        .app-footer a { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: color 0.2s; margin-bottom: 5px; }
        .app-footer a:hover { color: var(--accent); }
        .license-text { font-size: 0.75rem; opacity: 0.6; }
    </style>
</head>

            expertTip: "A métrica é 'Emoção'. Vozes robóticas já eram. Agora buscamos pausas, respiração e entonação.",
            criteria_explained: "Humanidade e capacidade de clonagem.",
            tools: [
                { id: "elevenlabs", name: "ElevenLabs", rank: 1, tags: ["SOTA", "Clonagem"], scores: { "Emoção": 100, "Clonagem": 100, "Preço": 60 }, pros: "Indistinguível de humanos; Clona voz com 1min de áudio.", cons: "Custo por caractere.", link: "https://elevenlabs.io" },
                { id: "openai_voice", name: "OpenAI Audio", rank: 2, tags: ["Latência"], scores: { "Velocidade": 100, "Emoção": 90, "Custo": 80 }, pros: "Vozes do ChatGPT; Muito expressivas.", cons: "Menos customizável que ElevenLabs.", link: "https://platform.openai.com/docs/guides/text-to-speech" },
                { id: "playht", name: "Play.ht", rank: 3, tags: ["Modelos"], scores: { "Variedade": 90, "Emoção": 85, "Preço": 70 }, pros: "Muitos modelos de voz diferentes.", cons: "Interface um pouco confusa.", link: "https://play.ht" }
            ]
        },
        "audio_transcribe": {
            title: "Áudio: Transcrição & Atas",
            expertTip: "WER (Word Error Rate) é a métrica. Ferramentas boas distinguem quem está falando (Diarization).",
            criteria_explained: "Precisão na transcrição e identificação de falantes.",
            tools: [
                { id: "sonix", name: "Sonix", rank: 1, tags: ["Profissional"], scores: { "Precisão": 98, "Edição": 100, "Preço": 50 }, pros: "Melhor editor de texto sincronizado ao áudio.", cons: "Pago por hora.", link: "https://sonix.ai" },
                { id: "otter", name: "Otter.ai", rank: 2, tags: ["Reuniões"], scores: { "Automação": 100, "Precisão": 85, "Preço": 90 }, pros: "Entra no Zoom sozinho; Gera ata.", cons: "Suporte a Português varia.", link: "https://otter.ai" },
                { id: "whisper", name: "OpenAI Whisper", rank: 3, tags: ["Open Source"], scores: { "Precisão": 95, "Custo": 100, "UX": 20 }, pros: "Gratuito (se rodar local); Melhor modelo base.", cons: "Requer conhecimento técnico para instalar.", link: "https://github.com/openai/whisper" }
            ]
        }
    };

    /* --- 2. ÁRVORE DE DECISÃO (DECISION TREE) --- */
    const decisionTree = {
        question: "Qual o seu objetivo principal?",
        options: [
            {
                label: "Pesquisa Acadêmica & Estudo",
                next: {
                    question: "O que você quer fazer?",
                    options: [
                        { label: "Validar fatos & Revisão Bibliográfica", resultId: "academic_research" },
                        { label: "Estudar, Resumir & Flashcards", resultId: "academic_study" }
                    ]
                }
            },
            {
                label: "Escrita & Raciocínio",
                next: {
                    question: "Qual o tipo de tarefa?",
                    options: [
                        { label: "Lógica Pura, Matemática ou Planejamento", resultId: "logic_reasoning" },
                        { label: "Marketing, Copywriting & Criatividade", resultId: "writing_copy" }
                    ]
                }
            },
            {
                label: "Programação (Coding)",
                next: {
                    question: "Ambiente de Desenvolvimento?",
                    options: [
                        { label: "Profissional (Produtividade na IDE)", resultId: "coding_pro" },
                        { label: "Local / Offline (Privacidade)", resultId: "coding_local" }
                    ]
                }
            },
            {
                label: "Documentos & Dados (RAG)",
                next: {
                    question: "Complexidade da Análise?",
                    options: [
                        { label: "Análise Profunda (Livros/Múltiplos Docs)", resultId: "rag_deep" },
                        { label: "Busca Rápida (Contratos/Faturas)", resultId: "rag_quick" }
                    ]
                }
            },
            {
                label: "Multimídia (Imagem/Vídeo/Áudio)",
                next: {
                    question: "Qual tipo de mídia?",
                    options: [
                        { 
                            label: "Imagens", 
                            resultId: "image_gen" 
                        },
                        { 
                            label: "Vídeo", 
                            next: {
                                question: "Estilo do Vídeo?",
                                options: [
                                    { label: "Criativo / Cinematográfico", resultId: "video_creative" },
                                    { label: "Avatares Falantes / Corporativo", resultId: "video_avatar" }
                                ]
                            }
                        },
                        { 
                            label: "Áudio", 
                            next: {
                                question: "Entrada ou Saída?",
                                options: [
                                    { label: "Criar Voz (Text-to-Speech)", resultId: "audio_tts" },
                                    { label: "Transcrever Áudio (Speech-to-Text)", resultId: "audio_transcribe" }
                                ]
                            }
                        }
                    ]
                }
            }
        ]
    };

    /* --- 3. LÓGICA DE EXECUÇÃO --- */
    const navContainer = document.getElementById('navContainer');
    const finalResults = document.getElementById('finalResults');
    const placeholder = document.getElementById('placeholderState');
    const btnRestart = document.getElementById('btnRestart');

    function renderQuestion(step) {
        // Criação da div da pergunta com animação
        const qDiv = document.createElement('div');
        qDiv.className = 'question-box';
        
        const h2 = document.createElement('h2');
        h2.innerText = step.question;
        qDiv.appendChild(h2);

        step.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt.label;
            btn.onclick = () => {
                // Desabilitar botões irmãos para indicar escolha
                Array.from(qDiv.querySelectorAll('.btn-option')).forEach(b => {
                    b.disabled = true;
                    if(b !== btn) b.style.opacity = '0.5';
                });
                btn.classList.add('selected');

                // Lógica de navegação
                if (opt.next) {
                    renderQuestion(opt.next);
                } else if (opt.resultId) {
                    showResults(opt.resultId);
                }
            };
            qDiv.appendChild(btn);
        });

        navContainer.appendChild(qDiv);
        
        // Auto-scroll suave para a nova pergunta
        setTimeout(() => {
            qDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    function showResults(resultId) {
        const data = outcomes[resultId];
        if (!data) return;

        placeholder.classList.add('hidden');
        finalResults.classList.remove('hidden');
        btnRestart.classList.remove('hidden');
        
        // Limpa e reconstrói resultados
        finalResults.innerHTML = ''; 

        // 1. Cabeçalho e Dica de Especialista
        const headerHTML = `
            <div style="margin-bottom: 30px; animation: fadeIn 0.5s ease;">
                <h1 style="margin:0; font-size: 1rem; color: var(--text-muted);">Ranking Recomendado</h1>
                <h2 style="margin-top:5px; font-size: 2rem;">${data.title}</h2>
            </div>
            
            <div class="expert-tip" style="animation: fadeIn 0.7s ease;">
                <h4>
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    A Visão do Especialista
                </h4>
                <p style="margin:0; line-height: 1.6;">${data.expertTip}</p>
                <div style="margin-top:15px; font-size:0.85rem; color:var(--text-muted); background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px; display:inline-block;">
                    <strong>Critério de Desempate:</strong> ${data.criteria_explained}
                </div>
            </div>
        `;
        finalResults.innerHTML += headerHTML;

        // 2. Cards de Ferramentas
        data.tools.forEach((tool, index) => {
            // Gera barras de score dinâmicas
            let scoresHTML = '';
            for (const [key, value] of Object.entries(tool.scores)) {
                // Define cor baseada na nota
                let color = 'var(--accent)';
                if(value < 50) color = 'var(--danger)';
                else if(value > 90) color = 'var(--success)';

                scoresHTML += `
                    <div class="score-item">
                        <label>${key}</label>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${value}%; background-color: ${color};"></div>
                        </div>
                    </div>
                `;
            }

            const card = document.createElement('div');
            card.className = 'ranking-card';
            // Delay escalonado para animação de entrada
            card.style.animationDelay = `${index * 0.1}s`; 
            
            card.innerHTML = `
                <div class="rank-badge rank-${tool.rank}">${tool.rank}º</div>
                <div class="card-header">
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-tags">
                        ${tool.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
                
                <div class="criteria-grid">
                    ${scoresHTML}
                </div>

                <div class="pros-cons">
                    <div class="pros"><strong>✓ Prós:</strong> ${tool.pros}</div>
                    <div class="cons"><strong>⚠ Contras:</strong> ${tool.cons}</div>
                </div>

                <div style="text-align:right; margin-top:20px;">
                    <a href="${tool.link}" target="_blank" class="action-link">
                        Visitar Site ➔
                    </a>
                </div>
            `;
            finalResults.appendChild(card);
        });
        
        // Scroll para o topo dos resultados em mobile
        if(window.innerWidth < 800) {
            resultsPanel.scrollIntoView({ behavior: 'smooth' });
        }
    }

    // Inicialização
    function init() {
        navContainer.innerHTML = '';
        finalResults.innerHTML = '';
        finalResults.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnRestart.classList.add('hidden');
        renderQuestion(decisionTree);
    }

    btnRestart.onclick = init;
    
    // Start
    init();

</script>
</body>
</html>
